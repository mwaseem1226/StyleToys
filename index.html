<script>
/* Style Toys loader: always starts the newest release (app-N.html). This file almost never changes. */
(function(){
 var BASE=10,LS=window.localStorage;
 try{sessionStorage.setItem("st_bt",String(Date.now()))}catch(e){}
 try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
 function url(n){return "app-"+n+".html"}
 function exists(n){return fetch(url(n)+"?t="+Date.now(),{method:"HEAD",cache:"no-store"}).then(function(r){return r.ok}).catch(function(){return null})}
 function fail(){var m=document.getElementById("bm");m.innerHTML="Could not load the catalogue.<br>Please check your internet.";var b=document.createElement("button");b.textContent="Try again";b.onclick=function(){location.reload()};m.appendChild(document.createElement("br"));m.appendChild(b)}
 async function run(){
  var n=parseInt(LS.getItem("st_n")||"0",10)||0;if(n<BASE)n=BASE;var latest=n,online=true;
  try{var r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(r.ok){var j=await r.json();if(j&&+j.n>latest)latest=+j.n}}catch(e){}
  while(latest>n){var ex=await exists(latest);if(ex===true)break;if(ex===null){online=false;break}latest--}
  if(!online)latest=n;
  if(online){for(var k=0;k<40;k++){var e2=await exists(latest+1);if(e2===true)latest++;else{if(e2===null)online=false;break}}}
  var key=url(latest),html=null,cache=null;
  try{cache=await caches.open("st-app")}catch(e){}
  if(cache){try{var hit=await cache.match(key);if(hit)html=await hit.text()}catch(e){}}
  if(html===null){
   try{var resp=await fetch(key,{cache:"no-store"});if(!resp.ok)throw 0;
    if(cache){try{var ks=await cache.keys();for(var i=0;i<ks.length;i++){if(ks[i].url.indexOf(key)<0)await cache.delete(ks[i])}await cache.put(key,resp.clone())}catch(e){}}
    html=await resp.text()}
   catch(e){if(cache){try{var all=await cache.keys();if(all.length){html=await (await cache.match(all[0])).text();latest=n}}catch(e2){}}}
  }
  if(html===null){fail();return}
  try{LS.setItem("st_n",String(latest))}catch(e){}
  document.open();document.write(html);document.close()
 }
 run()
})();
